name: Feature request
description: Suggest something new or a change to how something works
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should UniZ do instead? Mockups or rough sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you thought about
  - type: dropdown
    id: who
    attributes:
      label: Who is this for?
      multiple: true
      options: [Students, Faculty, Admins / exam cell, Contributors]
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself
